<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <title>WebSocket STOMP Client</title>
    </head>
    <body>
        <h1>WebSocket STOMP Client</h1>
        <div>
            Статус:
            <span id="status" class="disconnected">Отключено</span>
        </div>

        <div>
            <button id="connectBtn">Подключиться</button>
            <button id="disconnectBtn" disabled>Отключиться</button>
        </div>

        <div>
            <input
                type="text"
                id="messageInput"
                placeholder="Введите сообщение..."
                disabled
                onkeypress="if (event.key === 'Enter') sendMessage();"
            />
            <button id="sendBtn" onclick="sendMessage()" disabled>
                Отправить
            </button>
        </div>

        <div id="messages"></div>

        <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
        <script>
            let stompClient = null;

            const statusEl = document.getElementById("status");
            const connectBtn = document.getElementById("connectBtn");
            const disconnectBtn = document.getElementById("disconnectBtn");
            const sendBtn = document.getElementById("sendBtn");
            const messageInput = document.getElementById("messageInput");
            const messagesEl = document.getElementById("messages");

            function setStatus(text, cls) {
                statusEl.textContent = text;
                statusEl.className = cls;
            }

            function logMessage(text, type) {
                const div = document.createElement("div");
                div.className = "msg " + type;
                const time = new Date().toLocaleTimeString();
                const labels = {
                    "msg-in": "IN",
                    "msg-out": "OUT",
                    "msg-info": "INFO",
                };
                div.innerHTML = `<span class="label">${labels[type] || ""} [${time}]</span>${escapeHtml(text)}`;
                messagesEl.appendChild(div);
                messagesEl.scrollTop = messagesEl.scrollHeight;
            }

            function escapeHtml(s) {
                return String(s).replace(
                    /[&<>"']/g,
                    (c) =>
                        ({
                            "&": "&amp;",
                            "<": "&lt;",
                            ">": "&gt;",
                            '"': "&quot;",
                            "'": "&#39;",
                        })[c],
                );
            }

            function connect() {
                const socket = new SockJS("http://localhost:8080/chat");

                stompClient = Stomp.over(socket);
                stompClient.debug = null;

                setStatus("Подключение...", "connecting");

                stompClient.connect(
                    {},
                    function (frame) {
                        setStatus("Подключено", "connected");
                        logMessage(
                            "Подключение установлено: " + frame,
                            "msg-info",
                        );

                        connectBtn.disabled = true;
                        disconnectBtn.disabled = false;
                        sendBtn.disabled = false;
                        messageInput.disabled = false;
                        messageInput.focus();

                        stompClient.subscribe(
                            "/topic/echo",
                            function (message) {
                                const body = JSON.parse(message.body);
                                logMessage(body.text, "msg-in");
                            },
                        );
                    },
                    function (error) {
                        setStatus("Ошибка подключения", "disconnected");
                        logMessage("Ошибка: " + error, "msg-info");
                        connectBtn.disabled = false;
                        disconnectBtn.disabled = true;
                        sendBtn.disabled = true;
                        messageInput.disabled = true;
                    },
                );
            }

            function disconnect() {
                if (stompClient !== null) {
                    stompClient.disconnect(() => {
                        logMessage("Отключено", "msg-info");
                    });
                }
                setStatus("Отключено", "disconnected");
                connectBtn.disabled = false;
                disconnectBtn.disabled = true;
                sendBtn.disabled = true;
                messageInput.disabled = true;
            }

            function sendMessage() {
                const text = messageInput.value.trim();
                if (!text || !stompClient || !stompClient.connected) return;

                stompClient.send(
                    "/app/echo",
                    {},
                    JSON.stringify({ text: text }),
                );

                logMessage(text, "msg-out");
                messageInput.value = "";
                messageInput.focus();
            }

            connectBtn.addEventListener("click", connect);
            disconnectBtn.addEventListener("click", disconnect);
        </script>
    </body>
</html>
